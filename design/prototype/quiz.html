<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Weekend Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0891b2',
                        accent: '#f97316',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .option-card {
            transition: all 0.2s;
        }
        .option-card:active {
            transform: scale(0.98);
        }
        .option-card.selected {
            border-color: #0891b2;
            background-color: #f0fdfa;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <button onclick="goBack()" class="text-gray-600 hover:text-gray-900">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <span class="font-bold text-gray-900">Weekend Planner</span>
            <button onclick="confirmExit()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Progress Bar -->
    <div class="bg-white border-b">
        <div class="container mx-auto px-4 py-3">
            <div class="w-full bg-gray-200 rounded-full h-2">
                <div id="progressBar" class="bg-primary h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-sm text-gray-600 mt-2">Pertanyaan 1 dari 5</p>
        </div>
    </div>

    <!-- Quiz Container -->
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div id="quizContent" class="space-y-6">
            <!-- Question will be injected here -->
        </div>
    </div>

    <!-- Loading Modal -->
    <div id="loadingModal" class="fixed inset-0 bg-white hidden items-center justify-center z-50">
        <div class="text-center">
            <div class="text-6xl mb-6 animate-pulse">🤖✨</div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Sedang menganalisis preferensimu...</h2>
            <div class="flex justify-center gap-2 mt-4">
                <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 300ms"></div>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                id: 1,
                question: "Gimana mood kamu weekend ini?",
                options: [
                    { icon: "😌", label: "Santai / Healing", desc: "Pengen rileks aja", value: "santai" },
                    { icon: "🏃", label: "Aktif / Petualangan", desc: "Seru & menantang", value: "aktif" },
                    { icon: "💼", label: "Produktif", desc: "Belajar sesuatu baru", value: "produktif" },
                    { icon: "❤️", label: "Quality Time", desc: "Dengan orang special", value: "quality_time" },
                    { icon: "✏️", label: "Lainnya...", desc: "Tulis sendiri", value: "other" }
                ],
                required: true
            },
            {
                id: 2,
                question: "Dengan siapa weekend kali ini?",
                options: [
                    { icon: "🧘", label: "Sendiri", desc: "Me time", value: "sendiri" },
                    { icon: "💑", label: "Pasangan", desc: "Berdua", value: "pasangan" },
                    { icon: "👥", label: "Teman", desc: "2-4 orang", value: "teman" },
                    { icon: "👨‍👩‍👧", label: "Keluarga Kecil", desc: "Dengan anak", value: "keluarga_kecil" },
                    { icon: "👨‍👩‍👧‍👦", label: "Keluarga Besar", desc: "Banyak anggota", value: "keluarga_besar" }
                ],
                required: true
            },
            {
                id: 3,
                question: "Budget per orang kira-kira berapa?",
                options: [
                    { icon: "💰", label: "Hemat", desc: "< Rp 100.000", value: "hemat" },
                    { icon: "💰💰", label: "Menengah", desc: "Rp 100.000 - 300.000", value: "menengah" },
                    { icon: "💰💰💰", label: "Leluasa", desc: "> Rp 300.000", value: "leluasa" }
                ],
                required: true
            },
            {
                id: 4,
                question: "Lokasi yang kamu cari?",
                options: [
                    { icon: "📍", label: "Sekitar Jabodetabek", desc: "Dalam kota", value: "jabodetabek" },
                    { icon: "🚗", label: "Road Trip", desc: "Luar Jabodetabek", value: "road_trip" },
                    { icon: "✏️", label: "Lainnya...", desc: "Tulis sendiri", value: "other" }
                ],
                required: true
            },
            {
                id: 5,
                question: "Waktu keberangkatan? (opsional)",
                options: [
                    { icon: "☀️", label: "Pagi", desc: "06:00 - 12:00", value: "pagi" },
                    { icon: "🌤️", label: "Siang", desc: "12:00 - 18:00", value: "siang" },
                    { icon: "🌙", label: "Seharian", desc: "Pagi sampai malam", value: "seharian" }
                ],
                required: false
            }
        ];

        let currentQuestion = 0;
        let answers = {};

        function renderQuestion() {
            const question = quizData[currentQuestion];
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Pertanyaan ${currentQuestion + 1} dari ${quizData.length}`;

            const content = `
                <div class="fade-in">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6 leading-tight">
                        ${question.question}
                    </h2>
                    ${!question.required ? '<p class="text-sm text-gray-500 mb-4">Opsional - bisa skip</p>' : ''}
                    <div class="space-y-3">
                        ${question.options.map((opt, idx) => `
                            <button onclick="selectOption('${opt.value}')" 
                                    class="option-card w-full bg-white border-2 border-gray-200 rounded-xl p-4 text-left hover:border-primary hover:bg-primary/5 active:scale-98">
                                <div class="flex items-center gap-4">
                                    <span class="text-3xl">${opt.icon}</span>
                                    <div class="flex-1">
                                        <div class="font-semibold text-gray-900">${opt.label}</div>
                                        <div class="text-sm text-gray-600">${opt.desc}</div>
                                    </div>
                                </div>
                            </button>
                        `).join('')}
                    </div>
                    ${!question.required ? `
                        <button onclick="skipQuestion()" class="mt-4 text-primary hover:underline text-sm">
                            Skip pertanyaan ini →
                        </button>
                    ` : ''}
                </div>
            `;

            document.getElementById('quizContent').innerHTML = content;
        }

        function selectOption(value) {
            const question = quizData[currentQuestion];
            
            if (value === 'other') {
                const customValue = prompt(question.id === 1 ? 'Mood apa yang kamu cari?' : 'Lokasi mana yang kamu cari?');
                if (customValue) {
                    answers[`q${question.id}`] = customValue;
                    nextQuestion();
                }
            } else {
                answers[`q${question.id}`] = value;
                
                // Check if need conditional question
                if (question.id === 2 && (value === 'keluarga_kecil' || value === 'keluarga_besar')) {
                    // Add conditional question about children age
                    if (!quizData.find(q => q.id === 6)) {
                        quizData.splice(5, 0, {
                            id: 6,
                            question: "Usia anak?",
                            options: [
                                { icon: "👶", label: "Balita", desc: "0-5 tahun", value: "balita" },
                                { icon: "🎒", label: "Sekolah", desc: "6-12 tahun", value: "sekolah" },
                                { icon: "🎓", label: "Remaja", desc: "13-17 tahun", value: "remaja" },
                                { icon: "❌", label: "Tidak ada anak", desc: "", value: "tidak_ada" }
                            ],
                            required: true
                        });
                    }
                }
                
                nextQuestion();
            }
        }

        function skipQuestion() {
            answers[`q${quizData[currentQuestion].id}`] = 'skipped';
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < quizData.length) {
                renderQuestion();
            } else {
                // Quiz completed, show loading and redirect
                showLoading();
                setTimeout(() => {
                    window.location.href = 'result.html?' + new URLSearchParams(answers).toString();
                }, 2000);
            }
        }

        function goBack() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            } else {
                window.location.href = 'index.html';
            }
        }

        function confirmExit() {
            if (confirm('Yakin mau keluar dari quiz? Progres akan hilang.')) {
                window.location.href = 'index.html';
            }
        }

        function showLoading() {
            const modal = document.getElementById('loadingModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // Initialize
        renderQuestion();
    </script>
</body>
</html>
